name: resolvai-sprint4-e2e
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-e2e-only
      POSTGRES_DB: resolvai_e2e
    ports: ['127.0.0.1:55432:5432']
    tmpfs: ['/var/lib/postgresql/data']
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-e2e.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d resolvai_e2e']
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    # Versão do compose oficial Supabase consultado em 06/11/2026.
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:4173
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:local-e2e-only@db:5432/resolvai_e2e
      DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: local-e2e-only-never-use-in-production-2026
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_DISABLE_SIGNUP: 'false'
      LOG_LEVEL: error
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:9999/health']
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    image: nginx:alpine
    depends_on:
      auth: { condition: service_healthy }
    ports: ['127.0.0.1:54321:80']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
