name: Password recovery integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: |
          echo "sha=$(node -p 'require("./security/backend-ref.json").sha')" >> "$GITHUB_OUTPUT"
          echo "baseline=$(node -p 'require("./security/backend-ref.json").baseline')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Diegofreitas-mend/Resolvai_Backend_Node
          ref: ${{ steps.versions.outputs.sha }}
          path: .security-api
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danilomarley/Resolvai_Backend_Node
          ref: ${{ steps.versions.outputs.baseline }}
          path: .baseline-api
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci && npm run build && npm run typecheck && npm test
        working-directory: .security-api
      - run: npm ci && npm run build
        working-directory: .baseline-api
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f .security-api/tests/live/compose.yml up -d --wait --wait-timeout 120
      - name: Comprovar alteração efetiva na baseline sintética
        run: node .security-api/tests/live/reproduce.mjs .baseline-api
      - name: Validar segurança no backend candidato
        run: node --test .security-api/tests/live/password.live.mjs
      - name: Validar fluxo no navegador com SMTP real local
        run: npx playwright test --config security/playwright.config.mjs
      - if: always()
        run: docker compose -f .security-api/tests/live/compose.yml down
