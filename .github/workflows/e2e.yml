name: E2E contratante

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  customer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ler versão isolada da API
        id: backend
        run: echo "sha=$(node -p 'JSON.parse(require("fs").readFileSync("e2e/backend-ref.json")).sha')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: danilomarley/Resolvai_Backend_Node
          ref: ${{ steps.backend.outputs.sha }}
          path: .e2e-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: .e2e-backend
      - run: npm run build
        working-directory: .e2e-backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e-tools
      - name: Preparar PostgreSQL e Supabase Auth locais
        run: npm run e2e:up
      - name: Executar os fluxos no navegador contra a API
        run: npm run test:e2e
      - name: Remover credenciais dos diagnósticos
        if: always()
        id: sanitize
        run: npm run e2e:artifacts
      - uses: actions/upload-artifact@v4
        if: always() && steps.sanitize.outcome == 'success'
        with:
          name: e2e-diagnosticos-sanitizados
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Encerrar somente os serviços E2E
        if: always()
        run: npm run e2e:down

  candidate-integration:
    name: Candidatos de seguranca (sem merge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: candidates
        run: |
          echo "front=$(node -p 'require("./e2e/candidates.json").frontend')" >> "$GITHUB_OUTPUT"
          echo "back=$(node -p 'require("./e2e/candidates.json").backend')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: danilomarley/Resolvai_Cliente
          ref: ${{ steps.candidates.outputs.front }}
          path: .candidate-front
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Diegofreitas-mend/Resolvai_Backend_Node
          ref: ${{ steps.candidates.outputs.back }}
          path: .candidate-front/.e2e-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: node e2e/prepare-candidate.mjs
      - run: npm ci
        working-directory: .candidate-front
      - run: npm ci && npm run build
        working-directory: .candidate-front/.e2e-backend
      - run: npx playwright install --with-deps chromium
        working-directory: .candidate-front
      - run: npm run e2e:up
        working-directory: .candidate-front
      - run: npm run test:e2e
        working-directory: .candidate-front
      - if: always()
        id: sanitize-candidate
        run: npm run e2e:artifacts
        working-directory: .candidate-front
      - uses: actions/upload-artifact@v4
        if: always() && steps.sanitize-candidate.outcome == 'success'
        with:
          name: e2e-candidatos-sanitizados
          path: .candidate-front/e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: npm run e2e:down
        working-directory: .candidate-front
